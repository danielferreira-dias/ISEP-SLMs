[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "isep"
version = "0.1.0"
description = "Reproducible multimodal dermatology benchmarks for an ISEP SLM thesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
    "numpy>=2.3.0,<2.4",
    "openai>=2.0.0",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pillow>=12.0.0",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3",
    "streamlit>=1.59.2",
    "tenacity>=9.1,<10",
    "google-genai>=1.0.0,<3",
]

[project.scripts]
isep-benchmark = "src.benchmark.cli:main"
isep-e3-progress = "src.train.e3.progress_cli:main"
isep-e3-teacher = "src.train.e3.generation_cli:main"
isep-train = "src.train.cli:main"
isep-stage-a = "project.stages.stage_a:main"
isep-stage-b = "project.stages.stage_b:main"
isep-generate-e3 = "project.pipeline.generate:main"
isep-materialize-e3 = "project.pipeline.sft:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src*",
    "project",
    "project.stages",
    "project.teacher",
    "project.teacher.utils",
    "project.dataset",
    "project.pipeline",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.14,<2",
    "vllm==0.23.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
training = [
    "datasets>=4.3,<5",
    "huggingface-hub>=1,<2",
    "matplotlib>=3.10,<4",
    "nvidia-ml-py>=13.580",
    "psutil>=7,<8",
    "tensorboard>=2.20,<3",
    "unsloth>=2026.7.3,<2026.9",
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "training" },
    ],
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["project/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = "^project/scripts/"
