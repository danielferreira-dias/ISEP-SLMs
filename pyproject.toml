[project]
name = "isep"
version = "0.1.0"
description = "Reproducible multimodal dermatology benchmarks for an ISEP SLM thesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
    "numpy>=2.3.0,<2.4",
    "openai>=2.0.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.59.2",
]

[project.scripts]
isep-benchmark = "src.benchmark.cli:main"

[project.optional-dependencies]
gpu = [
    "vllm==0.23.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
training = [
    "unsloth>=2026.7.3",
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "training" },
    ],
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
]
