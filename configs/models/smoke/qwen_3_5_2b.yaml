# Smoke-test-only local model configuration.
#
# This file is intentionally outside the main model-config directory listing:
# Qwen3.5-9B remains the shortlisted replacement for the former 2B candidate.

schema_version: 1

model:
  id: qwen_3_5_2b_smoke
  display_name: Qwen 3.5 2B (Smoke Test)
  family: qwen
  evaluation_role: smoke_test
  training_stage: post_trained
  task_adaptation_stage: none

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
  context_length_tokens: 262144

source:
  type: huggingface
  repo_id: Qwen/Qwen3.5-2B
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: Qwen/Qwen3.5-2B
  revision: main

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      tensor_parallel_size: 1
      # The smoke test deliberately uses a smaller context to reduce memory.
      max_model_len: 16384
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      managed: true
      managed_allowed: true
    transformers_mps:
      type: local
      engine: transformers
      device: mps
      dtype: bfloat16
      max_model_len: 16384
      limit_images_per_prompt: 1
      managed: false
      managed_allowed: false

reasoning:
  enabled: false
  parser: qwen3
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: false

generation:
  profile: thinking_vision_language
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0

security:
  trust_remote_code: false
