# Large local reference-model candidate.

schema_version: 1

model:
  id: qwen_3_6_27b
  display_name: Qwen 3.6 27B
  family: qwen
  evaluation_role: teacher_candidate
  training_stage: post_trained
  task_adaptation_stage: none

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only

source:
  type: huggingface
  repo_id: Qwen/Qwen3.6-27B
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: Qwen/Qwen3.6-27B
  revision: main

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      max_model_len: 16384
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      managed: true
      managed_allowed: true

reasoning:
  enabled: true
  parser: qwen3
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: true

generation:
  profile: thinking_general_tasks
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0  # Neutral; equivalent to disabled.

security:
  trust_remote_code: false
