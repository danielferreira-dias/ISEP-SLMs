# Native omnimodal reasoning candidate served through OpenRouter.

schema_version: 1

model:
  id: mimo_v2_5_openrouter
  display_name: MiMo V2.5 (OpenRouter)
  family: mimo
  evaluation_role: teacher_candidate
  training_stage: provider_managed
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
    - video
    - audio
  structured_output_modes:
    - prompt_only
    - json_schema
  context_length_tokens: 1048576

source:
  type: provider_api
  provider: openrouter
  model_name: xiaomi/mimo-v2.5
  license: mit

backend:
  default_profile: openrouter
  profiles:
    openrouter:
      type: api
      engine: openrouter
      api_style: chat_completions
      api_key_env: OPENROUTER_API_KEY
      request_model: xiaomi/mimo-v2.5
      thinking_control: openrouter_reasoning
      request_timeout_seconds: 1200

reasoning:
  enabled: false
  exclude_from_structured_output: true

generation:
  # OpenRouter and Xiaomi publish temperature=1.0 and top_p=0.95 for this
  # route. The benchmark thinking-on phase activates the dormant budget.
  profile: mimo_v2_5_recommended
  thinking_mode: disabled
  reasoning_max_tokens: 10240
  temperature: 1.0
  top_p: 0.95

security:
  trust_remote_code: false
