# Multimodal reasoning candidate served through OpenRouter.

schema_version: 1

model:
  id: minimax_m3_openrouter
  display_name: MiniMax M3 (OpenRouter)
  family: minimax
  evaluation_role: teacher_candidate
  training_stage: provider_managed
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
    - video
  structured_output_modes:
    - prompt_only
    - json_schema
  context_length_tokens: 1048576
  maximum_output_tokens: 512000

source:
  type: provider_api
  provider: openrouter
  model_name: minimax/minimax-m3

backend:
  default_profile: openrouter
  profiles:
    openrouter:
      type: api
      engine: openrouter
      api_style: chat_completions
      api_key_env: OPENROUTER_API_KEY
      request_model: minimax/minimax-m3
      thinking_control: openrouter_reasoning
      request_timeout_seconds: 1200
      # The official MiniMax endpoint does not advertise the seed parameter.
      supports_seed: false
      provider:
        only:
          - minimax
        allow_fallbacks: false
        require_parameters: true

reasoning:
  enabled: false
  exclude_from_structured_output: true

generation:
  profile: minimax_m3_recommended
  thinking_mode: disabled
  reasoning_max_tokens: 10240
  temperature: 1.0
  top_p: 0.95
  seed: 42

security:
  trust_remote_code: false
