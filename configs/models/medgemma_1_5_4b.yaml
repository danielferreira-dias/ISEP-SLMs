# Small local medical multimodal fine-tuning candidate.

schema_version: 1

model:
  id: medgemma_1_5_4b
  display_name: MedGemma 1.5 4B IT
  family: medgemma
  evaluation_role: candidate
  training_stage: post_trained
  task_adaptation_stage: none
  domain: medical

usage:
  benchmark: true
  fine_tuning: true

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
  context_length_tokens: 131072
  maximum_output_tokens: 8192

source:
  type: huggingface
  repo_id: google/medgemma-1.5-4b-it
  revision: main
  access: gated
  license: health-ai-developer-foundations
  terms: health_ai_developer_foundations

processor:
  repo_id: google/medgemma-1.5-4b-it
  revision: main

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      max_model_len: 16384
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      managed: true
      managed_allowed: true

generation:
  profile: official_greedy
  do_sample: false  # Official default since 2026-01-23.

security:
  trust_remote_code: false
