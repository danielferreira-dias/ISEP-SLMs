# Low-cost multimodal judge candidate served through OpenRouter.

schema_version: 1

model:
  id: qwen_3_7_flash_openrouter
  display_name: Qwen 3.7 Flash (OpenRouter)
  family: qwen
  evaluation_role: judge_candidate
  training_stage: provider_managed
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
    - json_schema
  context_length_tokens: 1000000

source:
  type: provider_api
  provider: openrouter
  model_name: qwen/qwen3.7-flash

backend:
  default_profile: openrouter
  profiles:
    openrouter:
      type: api
      engine: openrouter
      api_style: chat_completions
      api_key_env: OPENROUTER_API_KEY
      request_model: qwen/qwen3.7-flash
      thinking_control: openrouter_reasoning
      request_timeout_seconds: 600

reasoning:
  enabled: false
  exclude_from_structured_output: true

generation:
  profile: deterministic_judge
  thinking_mode: enabled
  reasoning_effort: medium
  temperature: 0.0
  top_p: 1.0
  presence_penalty: 0.0
  seed: 42

security:
  trust_remote_code: false
