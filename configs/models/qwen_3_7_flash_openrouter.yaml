# Low-cost multimodal judge candidate served through OpenRouter.

schema_version: 1

model:
  id: qwen_3_7_flash_openrouter
  display_name: Qwen 3.7 Flash (OpenRouter)
  family: qwen
  evaluation_role: judge_candidate
  training_stage: provider_managed
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
    - json_schema
  context_length_tokens: 1000000
  maximum_output_tokens: 65536

source:
  type: provider_api
  provider: openrouter
  model_name: qwen/qwen3.7-flash

backend:
  default_profile: openrouter
  profiles:
    openrouter:
      type: api
      engine: openrouter
      api_style: chat_completions
      api_key_env: OPENROUTER_API_KEY
      request_model: qwen/qwen3.7-flash
      thinking_control: openrouter_reasoning
      request_timeout_seconds: 600
      provider:
        only:
          - alibaba
        allow_fallbacks: false
        require_parameters: true

reasoning:
  enabled: false
  exclude_from_structured_output: true

generation:
  # Qwen recommends top_p=0.95 for qwen-flash in thinking mode and top_k=20.
  # OpenRouter does not expose top_k for this route, so only supported fields
  # are pinned. Temperature is omitted because Qwen advises changing only one
  # of temperature and top_p on the hosted API.
  profile: qwen_3_7_reasoning_recommended
  thinking_mode: disabled
  reasoning_max_tokens: 10240
  top_p: 0.95
  presence_penalty: 0.0
  seed: 42

security:
  trust_remote_code: false
