# Local benchmark candidate model.

schema_version: 1

model:
  id: qwen_3_5_4b
  display_name: Qwen 3.5 4B
  family: qwen
  evaluation_role: candidate
  training_stage: post_trained
  task_adaptation_stage: none

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
    - json_schema

source:
  type: huggingface
  repo_id: Qwen/Qwen3.5-4B
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: Qwen/Qwen3.5-4B
  revision: main

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      # Leaves headroom for image tokens plus the 14,336-token thinking-on
      # completion cap used by the benchmark ablation.
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      managed: true
      managed_allowed: true

reasoning:
  enabled: false
  parser: qwen3
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: false

generation:
  profile: thinking_general_tasks
  reasoning_max_tokens: 10240
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0  # Neutral; equivalent to disabled.

security:
  trust_remote_code: false
