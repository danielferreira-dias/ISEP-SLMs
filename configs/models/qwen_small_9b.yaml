# Local benchmark candidate model.

schema_version: 1

model:
  id: qwen_3_5_9b
  display_name: Qwen 3.5 9B
  family: qwen
  evaluation_role: candidate
  training_stage: post_trained
  task_adaptation_stage: none

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only

source:
  type: huggingface
  repo_id: Qwen/Qwen3.5-9B
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: Qwen/Qwen3.5-9B
  revision: main

backend:
  type: local
  engine: transformers
  model_class: AutoModelForMultimodalLM
  pipeline_task: image-text-to-text

reasoning:
  enabled: true
  parser: qwen3
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: true

generation:
  profile: thinking_general_tasks
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0  # Neutral; equivalent to disabled.

security:
  trust_remote_code: false
