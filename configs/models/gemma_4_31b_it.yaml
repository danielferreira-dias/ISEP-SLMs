# Large local multimodal reference-model candidate.

schema_version: 1

model:
  id: gemma_4_31b_it
  display_name: Gemma 4 31B IT
  family: gemma
  evaluation_role: teacher_candidate
  training_stage: post_trained
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
  context_length_tokens: 262144

source:
  type: huggingface
  repo_id: google/gemma-4-31B-it
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: google/gemma-4-31B-it
  revision: main

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      max_model_len: 16384
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      request_timeout_seconds: 1200
      managed: true
      managed_allowed: true

reasoning:
  enabled: false
  parser: gemma4
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: false

generation:
  profile: gemma_4_recommended
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  repetition_penalty: 1.0  # Neutral; equivalent to disabled.

security:
  trust_remote_code: false
