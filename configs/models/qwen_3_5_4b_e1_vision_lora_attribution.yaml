# Local merged E1 Vision-LoRA checkpoint used only by visual attribution.

schema_version: 1

model:
  id: qwen_3_5_4b_e1_vision_lora_attribution
  display_name: Qwen 3.5 4B E1 Vision LoRA (epoch 3)
  family: qwen
  evaluation_role: candidate
  training_stage: post_trained
  task_adaptation_stage: e1_label_vision_lora
  domain: dermatology

usage:
  benchmark: false
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only

source:
  # The typed source contract uses the Hugging Face/Transformers loading
  # interface; repo_id may resolve to this immutable local merged checkpoint.
  type: huggingface
  repo_id: outputs/merged_models/qwen_3_5_4b_e1_vision_lora_epoch3
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  access: private
  license: apache-2.0

processor:
  repo_id: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a

backend:
  default_profile: transformers
  profiles:
    transformers:
      type: local
      engine: transformers
      device: cuda
      dtype: bfloat16
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      request_timeout_seconds: 300
      managed: false
      managed_allowed: false

reasoning:
  enabled: false
  parser: qwen3
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: false

generation:
  profile: visual_attribution_deterministic
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  seed: 42

security:
  trust_remote_code: false
