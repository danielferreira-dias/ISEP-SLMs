# Proprietary API reference-model candidate.

schema_version: 1

model:
  id: gpt_5_6_luna
  display_name: GPT-5.6 Luna
  family: gpt
  evaluation_role: teacher_candidate
  training_stage: provider_managed
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only
    - json_schema

source:
  type: provider_api
  provider: openai
  model_name: gpt-5.6-luna

backend:
  default_profile: azure
  profiles:
    azure:
      type: api
      engine: azure_openai
      api_style: responses
      endpoint_env: GPT_5_6_LUNA_AZURE_ENDPOINT
      api_key_env: GPT_5_6_LUNA_AZURE_API_KEY
      deployment_env: GPT_5_6_LUNA_AZURE_DEPLOYMENT
      api_version_env: GPT_5_6_LUNA_AZURE_API_VERSION

generation:
  profile: provider_default
  reasoning_effort: high

security:
  trust_remote_code: false
