# Small local multimodal fine-tuning candidate.

schema_version: 1

model:
  id: gemma_4_e4b_it
  display_name: Gemma 4 E4B IT
  family: gemma
  evaluation_role: candidate
  training_stage: post_trained
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: true

capabilities:
  modalities:
    - text
    - image
    - audio
  structured_output_modes:
    - prompt_only
  context_length_tokens: 131072

source:
  type: huggingface
  repo_id: google/gemma-4-E4B-it
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: google/gemma-4-E4B-it
  revision: main

backend:
  type: local
  engine: transformers
  model_class: AutoModelForMultimodalLM
  pipeline_task: image-text-to-text

reasoning:
  enabled: true
  parser: gemma4
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: true

generation:
  profile: gemma_4_recommended
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  repetition_penalty: 1.0  # Neutral; equivalent to disabled.

security:
  trust_remote_code: false
