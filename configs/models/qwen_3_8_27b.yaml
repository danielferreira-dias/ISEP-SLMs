# Open-weight Qwen 3.8 reference-model candidate evaluated locally.

schema_version: 1

model:
  id: qwen_3_8_27b
  display_name: Qwen 3.8 27B
  family: qwen
  evaluation_role: teacher_candidate
  training_stage: post_trained
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: false

capabilities:
  modalities:
    - text
    - image
  structured_output_modes:
    - prompt_only

source:
  type: huggingface
  repo_id: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  access: public
  license: apache-2.0

processor:
  repo_id: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      request_timeout_seconds: 1200
      managed: true
      managed_allowed: true

reasoning:
  # The comparison run deliberately disables thinking. Teacher-generation
  # reasoning profiles must be selected separately on Validation data.
  enabled: false
  parser: qwen3
  exclude_from_structured_output: true
  chat_template_kwargs:
    enable_thinking: false

generation:
  profile: deterministic_temperature_zero
  thinking_mode: disabled
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  seed: 42

security:
  trust_remote_code: false
