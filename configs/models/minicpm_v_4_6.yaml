# Small local multimodal fine-tuning candidate.

schema_version: 1

model:
  id: minicpm_v_4_6
  display_name: MiniCPM-V 4.6
  family: minicpm_v
  evaluation_role: candidate
  training_stage: post_trained
  task_adaptation_stage: none
  domain: general

usage:
  benchmark: true
  fine_tuning: true

capabilities:
  modalities:
    - text
    - image
    - video
  structured_output_modes:
    - prompt_only

source:
  type: huggingface
  repo_id: openbmb/MiniCPM-V-4.6
  revision: main
  access: public
  license: apache-2.0

processor:
  repo_id: openbmb/MiniCPM-V-4.6
  revision: main
  image:
    profile: fine_detail
    downsample_mode: 4x
    max_slice_nums: 36

backend:
  default_profile: vllm
  profiles:
    vllm:
      type: local
      engine: vllm
      device: cuda
      dtype: bfloat16
      max_model_len: 16384
      gpu_memory_utilization: 0.9
      limit_images_per_prompt: 1
      managed: true
      managed_allowed: true

generation:
  profile: official_default
  do_sample: true
  temperature: 0.7
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0

security:
  trust_remote_code: false
