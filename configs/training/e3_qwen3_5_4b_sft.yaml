# Frozen Stage C recipe for the primary E3 multitask SFT experiment.
#
# This run starts independently from the pinned official Qwen base. It never
# resumes an E1/E2 adapter, and no benchmark result may select its checkpoint.
schema_version: 1

stage:
  id: e3_qwen3_5_4b_sft
  kind: sft
  experiment: E3
  initialization: official_base
  backend: unsloth

student:
  config_path: project/configs/student_configs/qwen_3_5_4b.yaml

datasets:
  train:
    repo_id: danielfdias98/ISEPDistillDataset
    revision: 4437aff671af4f4e32a2ebf006fdd3f4e72dea4f
    config: e3_multitask_sft_v1
    split: sft_train
    expected_rows: 25084
    expected_task_counts:
      diagnosis: 6312
      morphology: 6312
      caption: 6312
      grounded_differential: 6127
      request_new_image: 21
  dev:
    # Frozen human diagnosis dev used by E1/E2. Teacher-generated E3 targets
    # are deliberately absent from checkpoint selection.
    repo_id: danielfdias98/ISEPDistillDataset
    revision: b215f0474e4931b5951da768e79a0d579d26919d
    config: diagnosis
    split: sft_dev
    expected_rows: 1229

training:
  num_train_epochs: 4
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  optimizer: adamw_8bit
  weight_decay: 0.001
  warmup_ratio: 0.05
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  max_length: null
  dataset_num_proc: 1
  seed: 42

evaluation:
  enabled: true
  strategy: epoch
  # `datasets.dev` is the sole checkpoint-selection dataset.
  selection_metric: macro_f1
  greater_is_better: true
  tie_break_metrics:
    - balanced_accuracy
    - eval_loss
    - earlier_epoch
  external_benchmark_selection: forbidden

checkpointing:
  output_dir: outputs/training/post_training/e3_qwen3_5_4b_sft
  save_strategy: epoch
  save_total_limit: 4
  save_lora_only: true

logging:
  logging_steps: 10
  report_to: none
