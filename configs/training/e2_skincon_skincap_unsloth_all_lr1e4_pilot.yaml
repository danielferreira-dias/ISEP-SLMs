# E2 learning-rate pilot: the 1e-4 counterpart of the 2e-4 Vision-LoRA smoke.
schema_version: 1

experiment:
  id: e2_skincon_skincap_unsloth_all_lr1e4_pilot
  phase: e2_skincon
  vision_profile: unsloth_all

dataset:
  source_directory: data/training/ISEPDermData
  source_version: 1.3.0
  hub_repo_id: danielfdias98/ISEPDermData
  hub_revision: f7403f817376de0dea0048bd3c490e294a0ccaca
  release_id: e1_label_v1
  release_directory: data/training/ISEPDermData/releases/e1_label_v1
  source_release_file: release.json
  taxonomy_file: metadata/taxonomy.json
  split:
    train_ratio: 0.85
    dev_ratio: 0.15
    seed: 42
    secondary_feature_weight: 0.25
    panel_groups_per_class: 10
    panel_seed: 1042
  expected:
    image_count: 7541
    group_count: 5671
    class_count: 21
    source_count: 4
    train_image_count: 6312
    train_group_count: 4820
    dev_image_count: 1229
    dev_group_count: 851
  image:
    max_edge_pixels: 512
    mode: RGB
    correct_exif_orientation: true
    preserve_aspect_ratio: true
    allow_upscale: false

e2:
  source_directory: data/training/ISEPDistillDataset
  hub_repo_id: danielfdias98/ISEPDistillDataset
  hub_revision: b215f0474e4931b5951da768e79a0d579d26919d
  release_id: isep_distill_dataset_v0.4.1
  schema_version: 0.4.1
  release_manifest_file: releases/isep_distill_dataset_v0.4.1/release.json
  release_manifest_sha256: 8638a3fea6ed49875359a9e8e1781f104e8350bae4edafb250ff58a4ef35ce13
  ontology_file: metadata/skincon_ontology.json
  ontology_sha256: b5ac80ff7ba2d53855a5e759930181b9cef1358747d385d0de5fcaa2eaf86847
  mixing_strategy: all_rows_deterministic_interleave_v2
  verify_all_shards: true
  expected:
    diagnosis_train: 6312
    diagnosis_dev: 1229
    morphology_train: 3068
    morphology_dev: 527
    caption_train: 2767
    caption_dev: 483
    morphology_concepts: 48

model:
  repo_id: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  processor_repo_id: Qwen/Qwen3.5-4B
  processor_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  dtype: bfloat16
  load_in_4bit: false
  trust_remote_code: false
  enable_thinking: false

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  bias: none
  target_modules: all-linear
  use_rslora: false
  use_loftq: false
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

trainer:
  epochs: 3
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  optimizer: adamw_8bit
  weight_decay: 0.001
  warmup_ratio: 0.05
  scheduler: linear
  max_grad_norm: 1.0
  gradient_checkpointing: unsloth
  bf16: true
  packing: false
  max_length: null
  early_stopping: false
  seed: 42
  logging_steps: 10
  save_strategy: epoch

evaluation:
  evals_per_epoch: 4
  generation_do_sample: false
  generation_temperature: 0.0
  selection_metric: macro_f1
  tie_break_metrics:
    - balanced_accuracy
    - eval_loss
    - earlier_epoch
  confirmation_seeds:
    - 42
    - 3407
    - 2026

artifacts:
  output_directory: outputs/training
  tensorboard: true
  save_png: true
  save_svg: true
  save_predictions_parquet: true
  include_clinical_images: false
  resource_sample_interval_seconds: 5.0
  thesis_export_directory: null
  checkpoint_hub:
    enabled: true
    repo_id: danielfdias98/ISEP-training-checkpoints
    revision: main
    repo_type: model
    private: true
    upload_smoke: false
