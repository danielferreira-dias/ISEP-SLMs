dataset:
  id: dermnet_kaggle
  version: kaggle_2020_06_24
  name: Dermnet (Kaggle mirror)
  task_type: coarse_disease_classification
  description: >
    Web-atlas clinical photographs arranged into 23 broad dermatology
    categories and distributed as train and test folders on Kaggle.
  license_id: CC_BY_NC_ND_4_0_KAGGLE_UPSTREAM_RIGHTS_UNVERIFIED

source:
  url: https://www.kaggle.com/datasets/shubhamgoel27/dermnet
  format: zip_directory_labels
  image_archive: configs/datasets/dermnet/data/raw/dermnet.zip
  archive_member_template: "{source_split}/{disease_original}/{filename}"
  row_unit: image

mapping:
  original_image_id: archive_member_path
  image_uri: archive_member_path
  group_id: archive_member_path
  disease_original: parent_directory
  diagnosis_basis: atlas_label
  source_split: top_level_directory

normalization:
  taxonomy: configs/taxonomies/diseases.yaml
  mapping_order:
    - reviewed_manual_mapping
  unmapped_label_policy: canonicalize_report_and_exclude_from_benchmark
  cautions:
    - The 23 folder labels combine multiple diseases and sometimes benign and malignant entities.
    - No patient, case, lesion, demographic, skin-tone, or diagnostic-confirmation metadata is supplied.
    - Treat the supplied split as unverified until exact and near-duplicate leakage checks are complete.
    - Kaggle's displayed licence does not by itself establish permission from every upstream image owner.

manifest:
  schema: configs/datasets/manifest_schema.yaml
  output: data/manifests/dermnet_kaggle_v3.parquet

coverage:
  role: excluded_from_disease_coverage
  reason: >
    Upstream image rights and source provenance are not sufficiently documented,
    and the directory labels are too coarse for the current disease benchmark.
