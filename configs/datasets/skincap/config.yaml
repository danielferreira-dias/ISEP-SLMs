dataset:
  id: skincap
  version: 4119044b3e14085d7439f88016d93376d433da5f
  name: SkinCAP
  task_type: image_captioning
  description: >
    Dermatology image-caption collection derived from Fitzpatrick17k and DDI,
    with English and Chinese captions and SKINCON morphology columns.
  license_id: SKINCAP_GATED_RESEARCH_USE

source:
  format: gated_huggingface_snapshot
  repo_id: joshuachou/SkinCAP
  revision: 4119044b3e14085d7439f88016d93376d433da5f
  root: configs/datasets/skincap/data
  image_root: configs/datasets/skincap/data/skincap
  excluded_image_root: configs/datasets/skincap/data/skincap/not_include
  metadata:
    gpt4_english: configs/datasets/skincap/data/skincap_v240623.csv
    google_translate_english: configs/datasets/skincap/data/skincap_v240715.xlsx
  row_unit: image

mapping:
  source_sample_id: id
  image_uri: skincap_file_path
  upstream_image_uri: ori_file_path
  disease_original: disease
  source_dataset: source
  caption_english_current: caption_en
  caption_english_legacy: caption_zh_polish_en
  caption_chinese: caption_zh
  unusable_column: Do not consider this image

normalization:
  taxonomy: configs/taxonomies/diseases.yaml
  join_to_upstream_manifests: true
  split_by_leakage_group_id: true
  exclude_frozen_validation_and_internal: true
  cautions:
    - Most captions contain an explicit diagnosis or differential diagnosis.
    - Raw captions are not observation-only morphology targets.
    - The gated agreement and upstream Fitzpatrick17k/DDI terms all apply.
    - Written derivative permission was attested by the dataset owner on 2026-08-15.
  observation_transform:
    version: skincap_observation_prefix_v1
    caption_variant: v240715_google_translate_en
    minimum_words: 5
    minimum_characters: 20
    mode: private_authorized_materialization
    audit_output: configs/datasets/skincap/observation_transform_audit.json
    release_id: isep_distill_dataset_v0.4.1
    release_manifest: >-
      data/training/ISEPDistillDataset/releases/
      isep_distill_dataset_v0.4.1/release.json
    accepted_train_rows: 2767
    accepted_dev_rows: 483
    authorization:
      status: written_permission_attested_by_dataset_owner
      attested_on: 2026-08-15
      document_stored_in_repository: false

manifest:
  schema: configs/datasets/manifest_schema.yaml
  output: data/manifests/skincap_v1.parquet

coverage:
  role: excluded_from_disease_coverage
  reason: >
    SkinCAP reuses upstream Fitzpatrick17k and DDI images and therefore does
    not provide independent disease cases for taxonomy selection or evaluation.
