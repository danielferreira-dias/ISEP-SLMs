# Provisional policy for selecting diseases for the closed-set benchmark.

disease_inclusion:
  id: core_disease_coverage_v3
  version: 3.1.0
  language: en
  status: provisional
  description: >
    Selects diseases with enough independent cases for meaningful training and
    evaluation. The thresholds must be reviewed after generating the first
    coverage report; excluded labels remain visible as long-tail diseases.

counting:
  unit: unique_group_id
  label_selection: primary_reference_only
  description: >
    Counts each patient or case group once per disease, even when the group has
    multiple images. For ranked differentials, only the highest-weight
    normalized diagnosis contributes to disease frequency.
  require_gradable: true
  require_normalized_disease_id: true
  deduplicate_before_counting: true
  duplicate_checks:
    - image_sha256
    - perceptual_hash
    - source_lineage

dataset_roles:
  taxonomy_contributors:
    - fitzpatrick17k_c
    - pad_ufes_20
    - scin
  external_evaluation_only:
    - ddi
    - skindisnet
    - dermobench
  excluded_from_coverage:
    skincon: Morphology annotation overlay; it does not provide independent disease cases.
    skincap: Derived from Fitzpatrick17k and DDI; counting it would duplicate upstream cases.
    skincare: Contains derived SkinCAP data and incompatible SkinCoT targets.
    dermavqa: Visual question answering data without a fixed fine-grained disease target.
    dermnet_kaggle: Upstream rights are unresolved and its 23 directory labels combine multiple diseases.

eligibility:
  minimum_unique_groups_total: 100
  minimum_unique_groups_per_split:
    train: 50
    validation: 20
    test: 30
  minimum_contributing_datasets: 2
  description: >
    A core disease must have at least 100 unique groups overall, enough groups
    in every requested split, and representation in at least two independent
    contributing datasets. These are starting values, not clinical constants.

exceptions:
  allow_manual_clinical_override: true
  require_written_rationale: true
  description: >
    A clinically important disease may be retained below a threshold only when
    the decision and the resulting statistical limitation are documented.

split_policy:
  source_group_by: group_id
  group_by: leakage_group_id
  stratify_by:
    - disease_id
    - dataset_id
  prevent_duplicate_leakage: true
  external_datasets_do_not_influence_taxonomy: true

deduplication:
  review:
    decisions: configs/datasets/duplicate_review.yaml
  exact_hash:
    algorithm: sha256
    input: encoded_image_bytes
  perceptual_hash:
    algorithm: phash_dct
    resize: 32
    low_frequency_size: 8
    bits: 64
    hamming_distance_threshold: 4
  source_lineage_keys:
    - source_url
    - upstream_image_uri
  exact_duplicate_policy: keep_one_canonical_matching_label
  exact_label_conflict_policy: apply_review_decision_or_exclude_all
  perceptual_candidate_policy: group_for_split_and_require_review
  outputs:
    duplicate_pairs: data/reports/duplicate_pairs_v3.csv
    duplicate_groups: data/reports/duplicate_groups_v3.csv
    duplicate_summary: data/reports/duplicate_summary_v3.csv
    perceptual_review_queue: data/reports/perceptual_review_queue_v3.csv
  description: >
    Computes exact and perceptual fingerprints for every normalized image.
    Exact redundant rows are excluded automatically. Perceptual and source-
    lineage candidates share a leakage group but remain included until review.

subgroup_reporting:
  metadata_usage: evaluation_only
  minimum_subgroup_unique_groups: 30
  minimum_disease_subgroup_unique_groups: 10
  keep_measurement_systems_separate: true
  description: >
    Reports demographic support before splitting. Fitzpatrick, grouped
    Fitzpatrick, and Monk Skin Tone values are not treated as one scale.

outputs:
  source_label_inventory: data/reports/source_disease_inventory_v3.csv
  all_source_disease_coverage: data/reports/all_source_disease_coverage_v3.csv
  coverage_parquet: data/reports/disease_coverage_v3.parquet
  coverage_csv: data/reports/disease_coverage_v3.csv
  included_diseases: data/reports/included_diseases_v3.yaml
  long_tail_diseases: data/reports/long_tail_diseases_v3.csv
  out_of_scope_labels: data/reports/out_of_scope_source_labels_v3.csv
  demographic_availability: data/reports/demographic_availability_v3.csv
  subgroup_coverage: data/reports/subgroup_coverage_v3.csv

report_columns:
  - disease_id
  - canonical_name
  - dataset_id
  - unique_group_count
  - image_count
  - train_group_count
  - validation_group_count
  - test_group_count
  - contributing_dataset_count
  - eligibility_status
  - exclusion_reason
