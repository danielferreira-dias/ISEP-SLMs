# Audited decisions for duplicate candidates in the dermatology manifests.

schema_version: 1

review:
  id: dermatology_duplicate_review_v1
  version: 1.0.0
  language: en
  reviewed_at: "2026-07-29"
  reviewer: codex_assisted_dataset_audit
  status: partial
  description: >
    Records evidence-based decisions for duplicate groups. Decisions resolve
    image-to-metadata associations; they do not infer a new medical diagnosis
    from image appearance.

exact_conflict_decisions:
  - duplicate_group_id: DUPLICATE_61a0781a5b02df36c762
    status: resolved
    action: keep_reviewed_canonical
    canonical_sample_id: PAD_UFES_20_PAT_56_86_479
    rejected_sample_ids:
      - PAD_UFES_20_PAT_56_88_274
    evidence:
      method: same_lesion_image_comparison
      supporting_sample_ids:
        - PAD_UFES_20_PAT_56_86_802
    rationale: >
      An independent image assigned to lesion 86 depicts the same lesion as
      the duplicated image. The lesion-86 SCC association is therefore kept.

