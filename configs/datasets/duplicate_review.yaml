perceptual_decisions:
  - duplicate_group_id: DUPLICATE_46ee76662defceb7fb41
    status: resolved
    action: reject_candidate
    reviewed_sample_ids:
      - PAD_UFES_20_PAT_380_1540_959
      - PAD_UFES_20_PAT_380_773_362
    rationale: >
      The full-resolution images are visibly different photographs. Their
      identical perceptual hashes are a false positive caused by similar
      low-frequency colour and composition.

  - duplicate_group_id: DUPLICATE_f09dd313d26db233ddbf
    status: resolved
    action: reject_candidate
    reviewed_sample_ids:
      - SKINDISNET_3a4ee601fb565525fa67
      - SKINDISNET_5e99b02959b07ff0ec4b
      - SKINDISNET_f07ae0d837233b26d014
    rationale: >
      The three cropped images contain visibly different lesions and body
      regions. Background removal and low-frequency similarity caused the
      perceptual-hash collision.

  - duplicate_group_id: DUPLICATE_832e94cee721e93fcd1d
    status: resolved
    action: reject_candidate
    reviewed_sample_ids:
      - FITZPATRICK17K_C_ed00c74f31d27200397604acf50ca753
      - SKINDISNET_309c63335d30a40729f4
    rationale: >
      The source photographs are visibly different. The match is a
      low-frequency perceptual-hash collision and not an internal-to-external
      duplicate.

  - duplicate_group_id: DUPLICATE_bb2476ce092c6efe64ed
    status: resolved
    action: reject_candidate
    reviewed_sample_ids:
      - SCIN_5546612363630401960_IMAGE_3
      - SKINDISNET_fccbc283c603c303e4e2
    rationale: >
