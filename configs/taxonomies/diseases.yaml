# Stable disease identifiers for the closed-set dermatology benchmark.

taxonomy:
  id: dermatology_diseases
  version: 2.1.0
  language: en
  description: >
    Twenty active diseases available to the model during the closed-set visual
    disease-ranking benchmark. Retired IDs remain reserved and must not be
    reused for a different clinical concept.
  active_disease_count: 20

diseases:
  - id: D001
    canonical_name: melanoma
    display_name: Melanoma
    aliases:
      - malignant melanoma

  - id: D002
    canonical_name: melanocytic_nevus
    display_name: Melanocytic nevus
    aliases:
      - mole
      - nevus

  - id: D003
    canonical_name: psoriasis
    display_name: Psoriasis
    aliases:
      - plaque psoriasis

  - id: D004
    canonical_name: basal_cell_carcinoma
    display_name: Basal cell carcinoma
    aliases:
      - BCC

  - id: D005
    canonical_name: squamous_cell_carcinoma
    display_name: Squamous cell carcinoma
    aliases:
      - cutaneous squamous cell carcinoma
      - SCC

  - id: D006
    canonical_name: seborrheic_keratosis
    display_name: Seborrheic keratosis
    aliases:
      - seborrhoeic keratosis

  - id: D007
    canonical_name: actinic_keratosis
    display_name: Actinic keratosis
    aliases:
      - solar keratosis

  - id: D009
    canonical_name: contact_dermatitis
    display_name: Contact dermatitis
    aliases:
      - contact eczema

  - id: D011
    canonical_name: acne_vulgaris
    display_name: Acne vulgaris
    aliases:
      - acne

  - id: D012
    canonical_name: rosacea
    display_name: Rosacea

  - id: D013
    canonical_name: vitiligo
    display_name: Vitiligo

  - id: D014
    canonical_name: eczema
    display_name: Eczema
    aliases:
      - eczematous dermatitis
      - eczema unspecified

  - id: D015
    canonical_name: seborrheic_dermatitis
    display_name: Seborrheic dermatitis
    aliases:
      - seborrhoeic dermatitis
      - seborrheic eczema
      - seborrhoeic eczema

  - id: D016
    canonical_name: folliculitis
    display_name: Folliculitis

  - id: D017
    canonical_name: urticaria
    display_name: Urticaria
    aliases:
      - hives

  - id: D018
    canonical_name: scabies
    display_name: Scabies

  - id: D019
    canonical_name: pityriasis_rosea
    display_name: Pityriasis rosea

  - id: D022
    canonical_name: prurigo_nodularis
    display_name: Prurigo nodularis

  - id: D023
    canonical_name: granuloma_annulare
    display_name: Granuloma annulare

  - id: D024
    canonical_name: erythema_multiforme
    display_name: Erythema multiforme

retired_diseases:
  - id: D008
    canonical_name: atopic_dermatitis
    display_name: Atopic dermatitis
    retired_in_version: 2.0.0
    reason: >
      Available contributor labels use broader eczema terminology and do not
      provide enough independently sourced, explicitly atopic cases.

  - id: D010
    canonical_name: tinea_corporis
    display_name: Tinea corporis
    retired_in_version: 2.0.0
    reason: >
      Available labels use broad or site-specific tinea terminology that
      cannot be safely interpreted as tinea corporis.

  - id: D020
    canonical_name: pyogenic_granuloma
    display_name: Pyogenic granuloma
    retired_in_version: 2.1.0
    reason: >
      Only 97 unique groups are available across taxonomy contributors; DDI
      cases cannot be used to satisfy the taxonomy-selection threshold.

  - id: D021
    canonical_name: dermatomyositis
    display_name: Dermatomyositis
    retired_in_version: 2.1.0
    reason: >
      Contributor support is concentrated in one dataset; DDI cannot be used
      to satisfy the independent-source requirement.
