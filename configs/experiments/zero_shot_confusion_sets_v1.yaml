# Zero-shot comparison on the paired visual disease confusion-set benchmark.

schema_version: 1

experiment:
  id: zero_shot_confusion_sets_v1
  version: 0.1.0
  type: zero_shot_evaluation
  status: provisional_pending_clinical_review
  description: >
    Compares candidate vision-language models on paired low- and
    high-confusability three-way dermatology ranking tasks.

benchmark:
  config: configs/benchmarks/visual_confusion_sets.yaml

models:
  - config: configs/models/qwen_3_6_27b.yaml
    enabled: true
  - config: configs/models/kimi_k2_6.yaml
    enabled: true
  - config: configs/models/gpt_5_6_luna.yaml
    enabled: true
  - config: configs/models/gemma_4_31b_it.yaml
    enabled: true
  - config: configs/models/qwen_small_9b.yaml
    enabled: true
  - config: configs/models/qwen_small_4b.yaml
    enabled: true
  - config: configs/models/gemma_4_e4b_it.yaml
    enabled: true
  - config: configs/models/minicpm_v_4_6.yaml
    enabled: true
  - config: configs/models/medgemma_1_5_4b.yaml
    enabled: true

overrides:
  generation:
    max_output_tokens: 128
  structured_output:
    mode: prompt_only

repetitions:
  count: 1
  seeds:
    - 42

tracking:
  save_environment: true
  save_git_commit: true
  save_config_snapshot: true
  save_model_revisions: true
  save_raw_responses: true
  save_rendered_prompts: true

output:
  directory: outputs/experiments/zero_shot_confusion_sets_v1
