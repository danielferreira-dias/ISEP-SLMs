# Zero-shot comparison on the closed-set visual dermatology benchmark.

schema_version: 1

experiment:
  id: zero_shot_visual_v1
  version: 2.0.0
  type: sealed_final_evaluation
  status: blocked_until_teacher_and_protocol_are_frozen
  description: >
    One-time paired final comparison on the fixed 1,000-case internal
    benchmark. This experiment is not a development or teacher-selection run
    and must remain blocked until the teacher, prompts, parsers, checkpoints,
    thresholds, and generation settings have been frozen on Validation.

benchmark:
  config: visual_top_k_closed_set
  evaluation_set: internal_benchmark
  source: auto
  repository: danielfdias98/ISEPDermaBench

models:
  - config: configs/models/qwen_3_6_27b.yaml
    enabled: true
  - config: configs/models/qwen_small_4b.yaml
    enabled: true
  - config: configs/models/qwen_3_7_flash_openrouter.yaml
    enabled: true
  - config: configs/models/minimax_m3_openrouter.yaml
    enabled: true
  - config: configs/models/mimo_v2_5_openrouter.yaml
    enabled: true

selection_policy:
  evaluation_role: internal_final_evaluation
  teacher_selection_allowed: false
  prompt_selection_allowed: false
  checkpoint_selection_allowed: false
  threshold_selection_allowed: false
  parser_selection_allowed: false
  generation_setting_selection_allowed: false
  reason: >
    internal_benchmark is the fixed paired final benchmark. All
    development decisions must be completed using the Validation experiment
    before this configuration is unblocked.

repetitions:
  count: 1
  seeds:
    - 42
  policy: one_sealed_execution

tracking:
  save_environment: true
  save_git_commit: true
  save_config_snapshot: true
  save_model_revisions: true
  save_raw_responses: true
  save_rendered_prompts: true

output:
  directory: outputs/experiments/zero_shot_visual_v1
