model:
  schema_version: 1
  model:
    id: qwen_3_5_2b_smoke
    display_name: Qwen 3.5 2B (Smoke Test)
    family: qwen
    evaluation_role: smoke_test
    training_stage: post_trained
    task_adaptation_stage: none
  usage:
    benchmark: true
    fine_tuning: false
  capabilities:
    modalities:
    - text
    - image
    structured_output_modes:
    - prompt_only
    context_length_tokens: 262144
  source:
    type: huggingface
    repo_id: Qwen/Qwen3.5-2B
    revision: main
    access: public
    license: apache-2.0
  processor:
    repo_id: Qwen/Qwen3.5-2B
    revision: main
  backend:
    default_profile: vllm
    profiles:
      vllm:
        type: local
        engine: vllm
        device: cuda
        dtype: bfloat16
        tensor_parallel_size: 1
        max_model_len: 16384
        gpu_memory_utilization: 0.9
        limit_images_per_prompt: 1
        managed: true
        managed_allowed: true
      transformers_mps:
        type: local
        engine: transformers
        device: mps
        dtype: bfloat16
        max_model_len: 16384
        limit_images_per_prompt: 1
        managed: false
        managed_allowed: false
  reasoning:
    enabled: true
    parser: qwen3
    exclude_from_structured_output: true
    chat_template_kwargs:
      enable_thinking: true
  generation:
    profile: thinking_vision_language
    do_sample: true
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
  security:
    trust_remote_code: false
benchmark:
  benchmark:
    id: visual_top_k_closed_set
    version: 3.2.0
    task: visual_disease_ranking
    description: 'Evaluates how accurately a vision-language model ranks dermatological
      diseases from a fixed taxonomy. The same configuration must be used for the
      base-model and post-trained-model evaluations.

      '
    top_k: 6
  prompt:
    path: prompts/benchmarks/top_k.yaml
  schema:
    path: schemas/visual_top_k.schema.json
  taxonomy:
    path: configs/taxonomies/diseases.yaml
    id_field: id
    label_field: display_name
    expected_size: 21
  dataset:
    manifest: data/benchmarks/visual_top_k_v1/datasets/internal/internal_benchmark_1000.parquet
    default_evaluation_set: internal_benchmark_1000
    split_config: configs/datasets/visual_top_k_split.yaml
    manifest_schema: configs/datasets/manifest_schema.yaml
    dataset_catalog: configs/datasets/catalog.yaml
    disease_inclusion_policy: configs/datasets/disease_inclusion.yaml
    sample_id_column: sample_id
    image_column: image_uri
    source_group_column: group_id
    group_column: leakage_group_id
    source_dataset_column: dataset_id
    label_column: disease_id
    diagnosis_basis_column: diagnosis_basis
    reference_diagnoses_column: reference_diagnoses
    reference_label_format: single_label
    description: 'Uses the normalized primary disease ID for ranking metrics while
      retaining every source differential in reference_diagnoses for auditing. Only
      rows that pass the disease-inclusion and leakage-prevention policies may enter
      this generated test manifest.

      '
    evaluation_sets:
      internal_benchmark_1000:
        manifest: data/benchmarks/visual_top_k_v1/datasets/internal/internal_benchmark_1000.parquet
        role: internal_primary
        description: 'Fixed paired benchmark of 1,000 independent internal-test groups.
          The same samples are used for the pre-training and post-training model evaluations.

          '
      internal_test:
        manifest: data/benchmarks/visual_top_k_v1/datasets/internal/internal_test.parquet
        role: internal_full_audit
        description: 'Complete held-out internal-test split from which the fixed 1,000-case
          paired benchmark is selected.

          '
      external_ddi:
        manifest: data/benchmarks/visual_top_k_v1/datasets/external/external_ddi.parquet
        role: external
        description: 'External evaluation on eligible DDI images using the same fixed
          taxonomy and prediction schema.

          '
      external_skindisnet:
        manifest: data/benchmarks/visual_top_k_v1/datasets/external/external_skindisnet.parquet
        role: external
        description: 'External evaluation on eligible SkinDisNet images using the
          same fixed taxonomy and prediction schema.

          '
  subgroup_evaluation:
    metadata_usage: evaluation_only
    include_metadata_in_model_prompt: false
    minimum_subgroup_unique_groups: 30
    minimum_per_disease_unique_groups: 10
    dimensions:
    - age_group_standardized
    - skin_tone_system_and_value
    - sex_or_gender_system_and_value
    - race_ethnicity
    metrics:
    - top_1_accuracy
    - top_3_accuracy
    - top_6_accuracy
    - mean_reciprocal_rank
    reporting:
      include_image_count: true
      include_unique_group_count: true
      include_missingness: true
      include_confidence_intervals: true
      include_worst_group_metric: true
      report_by_dataset: true
      report_by_disease_when_supported: true
  metrics:
  - id: top_1_accuracy
    description: 'The proportion of evaluated samples for which the first-ranked disease
      matches the reference disease. It measures primary diagnostic accuracy.

      '
    value: proportion
    higher_is_better: true
  - id: top_3_accuracy
    description: 'The proportion of evaluated samples for which the reference disease
      appears within the first three ranked predictions. It measures whether the correct
      diagnosis is present in a short differential diagnosis.

      '
    value: proportion
    higher_is_better: true
  - id: top_6_accuracy
    description: 'The proportion of evaluated samples for which the reference disease
      appears anywhere in the six ranked predictions. It measures recall within the
      complete requested differential diagnosis.

      '
    value: proportion
    higher_is_better: true
  - id: mean_reciprocal_rank
    description: 'The mean of 1 divided by the rank of the reference disease. A sample
      receives zero when the reference disease is absent from the predictions. It
      measures how highly the model ranks the correct diagnosis.

      '
    value: score_between_0_and_1
    higher_is_better: true
  - id: macro_f1_top_1
    description: 'The unweighted mean of the per-disease F1 scores, using the first-ranked
      disease as the predicted class. It measures top-1 performance while giving common
      and rare diseases equal importance.

      '
    value: score_between_0_and_1
    higher_is_better: true
  - id: json_validity_rate
    description: 'The proportion of raw model responses that can be parsed as valid
      JSON. It measures basic machine readability independently of diagnostic correctness.

      '
    value: proportion
    higher_is_better: true
  - id: schema_compliance_rate
    description: 'The proportion of parsed responses that satisfy the complete output
      schema and benchmark validation rules. It measures structural reliability, including
      required fields,  prediction count, and ranks.

      '
    value: proportion
    higher_is_better: true
  - id: invalid_disease_id_rate
    description: 'The proportion of evaluated samples containing at least one disease
      ID that is not present in the supplied taxonomy. It measures closed-set taxonomy
      adherence.

      '
    value: proportion
    higher_is_better: false
  - id: duplicate_prediction_rate
    description: 'The proportion of evaluated samples containing the same disease
      ID more than once. It measures whether the model produces a valid and useful
      differential rather than repeating a  diagnosis.

      '
    value: proportion
    higher_is_better: false
  validation:
    require_valid_json: true
    reject_unknown_disease_ids: true
    require_unique_disease_ids: true
    required_prediction_count: 6
    require_consecutive_ranks: true
    invalid_output_policy: count_as_incorrect
  comparison:
    primary_evaluation_set: internal_benchmark_1000
    stages:
    - pre_training_model
    - post_training_model
    paired_by: sample_id
    require_identical_sample_ids: true
    require_identical_manifest_checksum: true
    confidence_interval:
      method: paired_bootstrap
      confidence_level: 0.95
      resamples: 10000
  execution:
    max_output_tokens: 4096
    batch_size: 8
    resume: true
    save_raw_responses: true
    save_rendered_prompts: true
    fail_fast_on_invalid_output: false
  structured_output:
    mode: prompt_only
  output:
    directory: outputs/benchmark_runs
prompt:
  id: visual_top_k
  version: 1.0.0
  task: visual_disease_ranking
  language: en
  description: 'Instructs a vision-language model to rank a fixed number of candidate
    diseases using only the evidence visible in a dermatological image.

    '
  system_prompt: "You are performing a closed-set dermatological image-ranking task.\n\
    \nAnalyze only the supplied image and rank the {{ top_k }} most plausible diseases\
    \ from the allowed taxonomy.\n\nRules:\n  1. Use only disease IDs that appear\
    \ in the allowed taxonomy.\n  2. Return exactly {{ top_k }} unique disease predictions.\n\
    \  3. Order the predictions from most plausible to least plausible.\n  4. Use\
    \ consecutive integer ranks from 1 to {{ top_k }}.\n  5. Do not infer or invent\
    \ symptoms, patient history, or clinical context.\n  6. Return valid JSON that\
    \ matches the supplied schema.\n  7. Do not include explanations, Markdown, or\
    \ text outside the JSON object.\n"
  user_template: "Analyze the attached dermatological image.\n\nAllowed diseases:\n\
    {{ disease_taxonomy }}\n\nReturn exactly {{ top_k }} predictions using this JSON\
    \ structure:\n{\n  \"predictions\": [\n    {\n      \"rank\": 1,\n      \"disease_id\"\
    : \"D001\"\n    }\n  ]\n}\n\nThe example shows the structure only. Select and\
    \ rank diseases based on the\nsupplied image, and return no text outside the JSON\
    \ object.\n"
  schema_path: schemas/visual_top_k.schema.json
  taxonomy_rendering:
    fields:
    - id
    - display_name
    item_template: '- {{ id }}: {{ display_name }}'
  input_requirements:
    image: required
    disease_taxonomy: required
    top_k: required
    clinical_context: forbidden
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: visual_top_k.schema.json
  title: Visual Top-6 Disease Predictions
  description: Structured output for the closed-set dermatology image-ranking benchmark.
  type: object
  additionalProperties: false
  required:
  - predictions
  properties:
    predictions:
      type: array
      description: Six disease predictions ordered from most to least plausible.
      minItems: 6
      maxItems: 6
      items:
        type: object
        additionalProperties: false
        required:
        - rank
        - disease_id
        properties:
          rank:
            type: integer
            description: Prediction position, where 1 is the most plausible diagnosis.
            minimum: 1
            maximum: 6
          disease_id:
            type: string
            description: Disease identifier from the benchmark taxonomy.
            enum:
            - D001
            - D002
            - D003
            - D004
            - D005
            - D006
            - D007
            - D009
            - D011
            - D012
            - D013
            - D014
            - D015
            - D016
            - D017
            - D018
            - D019
            - D022
            - D023
            - D024
            - D025
disease_taxonomy:
  taxonomy:
    id: dermatology_diseases
    version: 2.2.0
    language: en
    description: 'Twenty-one active diseases available to the model during the closed-set
