  - id: D011
    canonical_name: acne_vulgaris
    display_name: Acne vulgaris
    aliases:
    - acne
  - id: D012
    canonical_name: rosacea
    display_name: Rosacea
  - id: D013
    canonical_name: vitiligo
    display_name: Vitiligo
  - id: D014
    canonical_name: eczema
