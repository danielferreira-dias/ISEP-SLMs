# Prompt used by the evidence-grounded dermatology diagnosis benchmark.

id: evidence_grounded_diagnosis
version: 1.1.0
task: evidence_grounded_visual_diagnosis
language: en
description: >
  Instructs a vision-language model to identify controlled morphology
  concepts, write an observation-only clinical description, rank six diseases,
  and explicitly link every diagnosis to findings declared from the supplied
  image.

system_prompt: |
  You are performing a closed-set evidence-grounded dermatology benchmark.

  Analyze only the supplied image. First identify visible morphology findings
  from the allowed morphology taxonomy. Express those findings as a concise
  observation-only clinical description. Then rank exactly {{ top_k }}
  diseases from the allowed disease taxonomy and link every disease to one or
  more of your declared findings.

  Rules:
    1. Report only morphology concepts that are visibly supported by the image.
    2. Use only concept IDs from the allowed morphology taxonomy.
    3. Give each finding a unique consecutive ID beginning with F1.
    4. Write clinical_description as a concise description of visible findings
       that is consistent with the structured findings.
    5. Do not include disease names, differential diagnoses, tests, treatment,
       management recommendations, or referral advice in clinical_description.
    6. Do not infer symptoms, duration, patient history, anatomical context
       outside the frame, pathology, dermoscopy findings, or laboratory results.
    7. Use only disease IDs from the allowed disease taxonomy.
    8. Return exactly {{ top_k }} unique diseases with consecutive ranks from
       1 through {{ top_k }}.
    9. Assign every finding and disease a confidence from 0.0 to 1.0.
   10. Disease confidence must not increase as rank decreases.
   11. Every disease must cite at least one supporting_finding_id, and every
       cited ID must refer to a finding declared in the same response.
   12. Set case_confidence from the top-ranked disease confidence:
         - low: below 0.40
         - moderate: 0.40 to below 0.75
         - high: 0.75 or above
   13. Return valid JSON matching the supplied schema.
   14. Do not include explanations, Markdown, or any text
       outside the JSON object.

user_template: |
  Analyze the attached dermatological image.

  Allowed morphology concepts:
  {{ morphology_taxonomy }}

  Allowed diseases:
  {{ disease_taxonomy }}

  Return exactly {{ top_k }} ranked diseases using this JSON structure:
  {
    "findings": [
      {
        "finding_id": "F1",
        "concept_id": "plaque",
        "confidence": 0.91
      },
      {
        "finding_id": "F2",
        "concept_id": "scale",
        "confidence": 0.86
      }
    ],
    "clinical_description": "A well-demarcated erythematous plaque with overlying scale.",
    "differential": [
      {
        "rank": 1,
        "disease_id": "D003",
        "confidence": 0.72,
        "supporting_finding_ids": ["F1", "F2"]
      }
    ],
    "case_confidence": "moderate"
  }

  This is WRONG:
  ```json
  {
    "findings": [
      {
        "finding_id": "F1",
        "concept_id": "plaque",
        "confidence": 0.91
      },
      {
        "finding_id": "F2",
        "concept_id": "scale",
        "confidence": 0.86
      }
    ],
    "clinical_description": "A well-demarcated erythematous plaque with overlying scale.",
    "differential": [
      {
        "rank": 1,
        "disease_id": "D003",
        "confidence": 0.72,
        "supporting_finding_ids": ["F1", "F2"]
      }
    ],
    "case_confidence": "moderate"
  }
  ```

  The example demonstrates the structure only. Select findings and diseases
  from the supplied taxonomies based solely on the attached image. Return no
  text outside the JSON object.

schema_path: schemas/evidence_grounded_diagnosis.schema.json

taxonomy_rendering:
  disease:
    fields:
      - id
      - display_name
    item_template: "- {{ id }}: {{ display_name }}"
  morphology:
    fields:
      - id
      - display_name
    item_template: "- {{ id }}: {{ display_name }}"

input_requirements:
  image: required
  disease_taxonomy: required
  morphology_taxonomy: required
  top_k: required
  clinical_context: forbidden

output_requirements:
  structured_findings_required: true
  free_text_clinical_description: required_observation_only
  description_must_match_structured_findings: true
  diagnosis_in_description: forbidden
  tests_or_management_in_description: forbidden
  diagnosis_count: 6
  evidence_links_required: true
