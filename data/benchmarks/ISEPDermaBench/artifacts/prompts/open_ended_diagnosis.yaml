id: open_ended_diagnosis_prompt
version: 1.1.0

system_prompt: |
  You are evaluating a dermatology image in a research benchmark.
  Base the assessment only on visible evidence in the image. Do not invent
  symptoms, duration, history, laboratory results, pathology, or treatment
  response. Do not reveal private chain-of-thought. Return only a concise
  clinical assessment and its supporting visible evidence.

user_template: |
  Analyse the dermatological image and respond naturally in concise clinical
  prose.

  Begin by describing the relevant visible findings. Then provide exactly
  three unique diagnoses in an explicitly ordered differential. Clearly mark
  them as the most likely diagnosis, second most likely diagnosis, and third
  most likely diagnosis.

  Briefly connect each diagnosis to the visible findings that support or
  weaken it. Base the assessment only on information visible in the image. Do
  not invent symptoms, duration, medical history, laboratory results,
  pathology, treatment response, or other clinical context that was not
  provided.

  Do not use JSON, tables, disease identifiers, or a predefined taxonomy. Do
  not reveal private chain-of-thought. Provide only the concise clinical
  assessment and its supporting visible evidence.
